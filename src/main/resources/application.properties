#
# Definiendo propiedades generales
#
server.port=8081
spring.application.name=mi-aplicacion

# Todas las solicitudes deben iniciar con /mycoolapp
server.servlet.context-path=/mycoolapp

# Se puede exponer todos los endpoints de Actuator con asterisco (*)
# Tambien con coma (health, information, beans...)
management.endpoints.web.exposure.include=*
management.info.env.enabled=true

# Excluir endpoints individuales de Actuator
# management.endpoints.web.exposure.exclude=health, info

info.app.name=Mi aplicacion
info.app.description=Mi primera app en Spring Boot
info.app.version=1.0.0

#
# Definiendo mis propias propiedades
#
friend.name=Ralf Hutter
coach.name=Florian Schneider
team.name=Kraftwerk
